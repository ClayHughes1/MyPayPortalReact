name: MyPay Portal CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build


  backend:
    name: Build ASP.NET Core API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore API dependencies
        run: dotnet restore ./backend/AppPortal.Api/AppPortal.Api.csproj

      - name: Build API
        run: dotnet build ./backend/AppPortal.Api/AppPortal.Api.csproj --configuration Release --no-restore


  external-api:
    name: Build External Payment API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore External API dependencies
        run: dotnet restore ./APPPortal.ExternalApi/APPPortal.ExternalApi.csproj

      - name: Build External API
        run: dotnet build ./APPPortal.ExternalApi/APPPortal.ExternalApi.csproj --configuration Release --no-restore